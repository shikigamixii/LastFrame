services:
  lastframe:
    build: .
    container_name: lastframe
    ports:
      # Set HOST_PORT in your .env to any free port that doesn't conflict with DSM's 8080.
      - "${HOST_PORT}:8080"
    volumes:
      - /volume1/docker/lastframe/data:/data
    environment:
      # Configure Plex, Jellyfin, or both. Any of these can be left blank here
      # and entered in the setup wizard instead. If you do set them in .env, the
      # env value wins. You need at least one provider.
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_WEBHOOK_SECRET=${PLEX_WEBHOOK_SECRET:-}
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - JELLYFIN_WEBHOOK_SECRET=${JELLYFIN_WEBHOOK_SECRET:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - DATA_DIR=/data
    restart: unless-stopped
