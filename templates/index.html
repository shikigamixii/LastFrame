<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LastFrame</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="header">
  <h1>Last<span>Frame</span></h1>
  <div style="display: flex; gap: 0.5rem;">
    <button class="btn-settings logout-btn" id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>
    <button class="btn-settings" onclick="openSettings()">⚙ Libraries</button>
  </div>
</div>
<div class="breadcrumbs" id="breadcrumbs"></div>
<div class="container" id="content"><div class="loading">Loading</div></div>

<!-- Login Overlay -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <h2>Admin Login</h2>
    <input type="text" id="loginUsername" placeholder="Username">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="doLogin()">Login</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="deleteModal"><div class="modal"><h3>Confirm Delete</h3><p id="deleteModalBody"></p><div class="warning">This will permanently delete the file(s) from disk. If you are seeding these files, this will break the torrent.</div><div class="modal-actions"><button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button><button class="btn-confirm-delete" id="deleteModalConfirm">Delete</button></div></div></div>

<!-- Bulk Assign Modal -->
<div class="modal-overlay" id="bulkAssignModal">
  <div class="modal" style="max-width:450px">
    <h3 style="color:var(--accent)">Assign Users to Selected Items</h3>
    <div style="margin:1rem 0">
      <p style="margin-bottom:0.75rem; font-size:0.85rem;" id="bulkAssignCount"></p>
      <div id="bulkAssignUsers" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;"></div>
      <div id="bulkAssignError" style="color:var(--red); font-size:0.8rem; margin-bottom:1rem"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeBulkAssignModal()">Cancel</button>
      <button class="btn-confirm-delete" style="background:var(--accent)" onclick="confirmBulkAssign()">Assign</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal" style="max-width:500px">
    <div class="settings-body" id="settingsBody"></div>
    <div style="margin-top:1rem; border-top:1px solid var(--border); padding-top:1rem;">
      <button class="btn-settings" style="width:100%; margin-bottom:0.5rem" onclick="openAdminModal()">Change Admin Credentials</button>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSettings()">Close</button>
        <button class="btn-confirm-delete" style="background:var(--accent)" onclick="saveSettings()">Save Libraries</button>
      </div>
    </div>
  </div>
</div>

<!-- Admin Credentials Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal" style="max-width:450px">
    <h3 style="color:var(--accent)">Change Admin Credentials</h3>
    <div style="margin:1rem 0">
      <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--text-muted)">Current Username</label>
      <input type="text" id="adminCurrentUsername" style="width:100%; padding:0.5rem; background:var(--bg-primary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); margin-bottom:1rem">
      <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--text-muted)">Current Password</label>
      <input type="password" id="adminCurrentPassword" style="width:100%; padding:0.5rem; background:var(--bg-primary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); margin-bottom:1rem">
      <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--text-muted)">New Username</label>
      <input type="text" id="adminNewUsername" style="width:100%; padding:0.5rem; background:var(--bg-primary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); margin-bottom:1rem">
      <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--text-muted)">New Password</label>
      <input type="password" id="adminNewPassword" style="width:100%; padding:0.5rem; background:var(--bg-primary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); margin-bottom:1rem">
      <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--text-muted)">Confirm New Password</label>
      <input type="password" id="adminConfirmPassword" style="width:100%; padding:0.5rem; background:var(--bg-primary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); margin-bottom:1rem">
      <div id="adminModalError" style="color:var(--red); font-size:0.8rem; margin-bottom:1rem"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAdminModal()">Cancel</button>
      <button class="btn-confirm-delete" style="background:var(--accent)" onclick="saveAdminCredentials()">Update</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
