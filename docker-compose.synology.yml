services:
  lastframe:
    build: .
    container_name: lastframe
    ports:
      # Set HOST_PORT in your .env to any free port that doesn't conflict with DSM's 8080.
      - "${HOST_PORT}:8080"
    volumes:
      - /volume1/docker/lastframe/data:/data
    environment:
      # All Plex settings can be left blank here and entered in the setup
      # wizard instead. If you do set them in .env, the env value wins.
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_WEBHOOK_SECRET=${PLEX_WEBHOOK_SECRET:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - DATA_DIR=/data
      # Background poll interval (seconds) for Plex history. Needed because
      # media.scrobble webhooks do not fire for managed (Plex Home) users.
      # Set to 0 to disable.
      - PLEX_HISTORY_POLL_INTERVAL=${PLEX_HISTORY_POLL_INTERVAL:-}
    # DSM sometimes hands containers a DNS resolver they can't reach, which
    # breaks outbound lookups like plex.tv (needed for managed-user token
    # minting). Pin to public resolvers so the container can always do
    # external DNS regardless of host config.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
